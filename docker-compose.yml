# 一键启动：机器人（qqbot）+ 知识库自动更新（kbsync）+ PostgreSQL（pgvector）。
#
#   cp .env.example .env            # 不改也能用
#   docker compose up -d --build
#
# 项目名取这个目录的名字（没有写死），镜像名也跟着项目名走：
# 同一台机器上放几个实例，或者和别的见山部署放在一起，互不相干。
#
# 配置（config/）是构建时拷进镜像的：改了配置要重新 `docker compose up -d --build`。
# 凭据（config/secrets.yaml）、自己写的插件（sites/、plugins/）是挂进去的：改了重启就生效。

x-bot: &bot
  image: ${COMPOSE_PROJECT_NAME}-bot:local
  restart: unless-stopped
  stop_grace_period: 30s
  volumes:
    # 凭据不进镜像。文件不存在时直接报错，而不是悄悄建一个同名的空目录
    - type: bind
      source: ./config/secrets.yaml
      target: /app/config/secrets.yaml
      read_only: true
      bind:
        create_host_path: false
    - ./sites:/app/sites:ro
    - ./plugins:/app/plugins:ro
    - ./data:/data

x-bot-env: &bot-env
  JIANSHANAGENT_CONFIG_DIR: /app/config
  JIANSHANAGENT_CONFIG_OVERRIDES_DIR: /data/config
  JIANSHANAGENT_KB_DIR: /data/kb
  # 在管理后台点「更新」装的新版本放在这里（数据目录里，重建容器还在），盖住镜像里装的那一份
  JIANSHANAGENT_UPDATE_DIR: /data/core
  JIANSHANAGENT_LOG_JSON: "1"
  JIANSHANAGENT_POSTGRES_DSN: postgresql://jianshanagent:${POSTGRES_PASSWORD:-jianshanagent}@postgres:5432/jianshanagent
  TZ: Asia/Shanghai

services:
  init:
    # 只跑一下就退出：把数据目录交给容器里的用户（uid 10001）。
    # Linux 上 ./data 第一次是 Docker 用 root 建出来的，不做这一步机器人写不进去
    image: ${COMPOSE_PROJECT_NAME}-bot:local
    build: .
    user: root
    restart: "no"
    command: ["chown", "-R", "10001:10001", "/data"]
    healthcheck:
      disable: true
    volumes:
      - ./data:/data

  qqbot:
    <<: *bot
    environment:
      <<: *bot-env
      JIANSHANAGENT_ADMIN_TOKEN_FILE: /data/admin/token
      JIANSHANAGENT_SESSION_STORE_DIR: /data/qq_ws
      # .env 里写 JIANSHANAGENT_DRY_RUN=1：不连 QQ，只开管理后台和网页对话
      JIANSHANAGENT_DRY_RUN: ${JIANSHANAGENT_DRY_RUN:-}
    depends_on:
      init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
    ports:
      # 管理后台和健康检查（默认 http://127.0.0.1:8080）
      - "${ADMIN_BIND_ADDR:-127.0.0.1}:${ADMIN_PORT:-8080}:8080"

  kbsync:
    # 知识库自动更新：每小时看一次 wiki 改了什么，只重做变了的部分
    <<: *bot
    command: ["python", "-m", "jianshanagent.plugins.knowledge", "sync", "--loop"]
    environment:
      <<: *bot-env
    depends_on:
      init:
        condition: service_completed_successfully
      qqbot:
        condition: service_started
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-m", "jianshanagent.plugins.knowledge", "sync", "--health"]
      interval: 60s
      timeout: 20s
      retries: 3
      start_period: 60s

  postgres:
    image: pgvector/pgvector:0.8.7-pg17
    restart: unless-stopped
    stop_grace_period: 60s
    shm_size: 256mb
    environment:
      POSTGRES_DB: jianshanagent
      POSTGRES_USER: jianshanagent
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-jianshanagent}
      TZ: Asia/Shanghai
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jianshanagent -d jianshanagent"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
