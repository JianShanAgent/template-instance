# 复制为 config/secrets.yaml 后填写（secrets.yaml 已在 .gitignore 忽略，不会提交入库）
qq:
  app_id: "YOUR_APP_ID"
  client_secret: "YOUR_APP_SECRET"

postgres:
  # 使用 Python/uv 本机直跑且暂未安装 PostgreSQL 时，留空即可（自动降级为内存存储对话记录）；
  # 使用本机 PostgreSQL 时填：postgresql://用户名:密码@127.0.0.1:5432/jianshanagent
  # 使用 Docker Compose 启动时，compose 文件已通过环境变量自动注入容器内数据库地址，无需修改此处。
  dsn: ""

llm:
  # 对话大模型密钥（默认配置对接小米 MiMo；若换成 DeepSeek / OpenAI 等，请同步新建 config/core.llm.yaml 修改 base_url 与模型名）
  api_key: "YOUR_LLM_API_KEY"

wiki:
  # 可选：目标 Wiki 若启用了 Cloudflare 质询拦截且分配了放行密钥，填在这里并在 core.wiki.yaml 配置 auth_header
  authkey: ""
  cookie: ""

gitee_ai:
  # 嵌入模型密钥（默认对接模力方舟 ai.gitee.com 的 Qwen3-VL-Embedding-8B，用于知识库检索与以图搜图；留空则仅使用关键词搜索）
  api_key: ""
